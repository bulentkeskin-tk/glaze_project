display_information:
  name: Glaze
  description: Lightweight AI-assisted coffee chat pairing bot
  background_color: "#6f4e37"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Glaze
    always_online: false
  slash_commands:
    - command: /glaze-on
      url: https://YOUR-DOMAIN/slack/commands
      description: Opt in to Glaze
      usage_hint: ""
      should_escape: false
    - command: /glaze-off
      url: https://YOUR-DOMAIN/slack/commands
      description: Opt out of Glaze
      usage_hint: ""
      should_escape: false
    - command: /glaze-frequency
      url: https://YOUR-DOMAIN/slack/commands
      description: Set weekly, biweekly, or monthly cadence
      usage_hint: weekly|biweekly|monthly
      should_escape: false
    - command: /glaze-snooze
      url: https://YOUR-DOMAIN/slack/commands
      description: Snooze Glaze for 1-4 weeks
      usage_hint: 1|2|3|4
      should_escape: false
    - command: /glaze-home
      url: https://YOUR-DOMAIN/slack/commands
      description: Refresh the Glaze Home tab
      usage_hint: ""
      should_escape: false
    - command: /glaze-run-now
      url: https://YOUR-DOMAIN/slack/commands
      description: Admin test run
      usage_hint: ""
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - users.profile:read
settings:
  event_subscriptions:
    request_url: https://YOUR-DOMAIN/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://YOUR-DOMAIN/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
