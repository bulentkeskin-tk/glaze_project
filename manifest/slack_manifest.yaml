# Glaze Slack App Manifest
# 
# IMPORTANT: Before using this manifest, replace oozkjnyhvrndobksdyld with your actual
# Supabase project reference (found in your Supabase project URL).
# Example: abcdefghijklmnopqrst
#
# All URLs point to a single Edge Function endpoint that handles all Slack interactions.

display_information:
  name: Glaze
  description: Lightweight AI-assisted coffee chat pairing bot
  background_color: "#6f4e37"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Glaze
    always_online: false
  slash_commands:
    - command: /glaze-on
      url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
      description: Opt in to Glaze
      usage_hint: "Opt in to receive AI-suggested coffee chat pairings in your DMs"
      should_escape: false
    - command: /glaze-off
      url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
      description: Opt out of Glaze
      usage_hint: "Opt out to stop receiving AI-suggested coffee chat pairings in your DMs"
      should_escape: false
    - command: /glaze-frequency
      url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
      description: Set weekly, biweekly, or monthly cadence
      usage_hint: weekly|biweekly|monthly
      should_escape: false
    - command: /glaze-snooze
      url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
      description: Snooze Glaze for 1-4 weeks
      usage_hint: 1|2|3|4
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - users:read
      - users.profile:read
settings:
  event_subscriptions:
    request_url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://oozkjnyhvrndobksdyld.supabase.co/functions/v1/slack-events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
